[package]
name = "rcp2ctl"
description = "Linux control tool for the RØDECaster Pro II (CLI, then TUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rcp2-audio = { path = "../rcp2-audio" }
rcp2-hid = { path = "../rcp2-hid" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.151"
